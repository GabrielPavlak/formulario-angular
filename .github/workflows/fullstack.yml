name: Full-stack checks
on:
  push:
    branches: [feature/pesquisa-tecnologia-fullstack]
  pull_request:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Build Angular application
        run: npm run build
      - name: Backend Node.js tests
        run: npm run test:backend
