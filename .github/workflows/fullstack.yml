name: Banco Escola - checagens full-stack
on:
  push:
    branches: [main,feature/banco-ficticio]
  pull_request:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Build Angular
        run: npm run build
      - name: Backend tests
        run: npm run test:backend
