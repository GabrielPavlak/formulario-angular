name: Banco Escola - qualidade full-stack
on:
  push:
    branches: [main,feature/banco-escola-refinamento-entrega]
  pull_request:
    branches: [main]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Instalar dependências com lockfile
        run: npm ci
      - name: Compilar Angular para produção
        run: npm run build
      - name: Testes de interface Angular
        run: npm test -- --watch=false
      - name: Testes unitários e de integração da API
        run: npm run test:backend
