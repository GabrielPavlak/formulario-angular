name: Banco Escola - validação full-stack
on:
  push:
    branches: [main,feature/banco-escola-experiencia-premium]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Angular production build
        run: npm run build
      - name: Angular unit tests
        run: npm test -- --watch=false
      - name: Backend and integration tests
        run: npm run test:backend
